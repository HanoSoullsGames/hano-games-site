<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pixel Rampage вЂ” Hano Games</title>
<style>
  @font-face {
    font-family: 'DotGothic';
    src: url('TemplateData/dotgothic.woff2') format('woff2');
    font-display: swap;
  }

  :root {
    --bg: #05050c;
    --ink: #ecebf5;
    --dim: #9b9ab4;
    --accent: #ff9f1c;
    --line: #262640;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'DotGothic', ui-monospace, monospace;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #unity-canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    outline: none;
  }

  #loader {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background:
      radial-gradient(900px 500px at 15% 0%, rgba(60, 40, 120, 0.45), transparent 70%),
      radial-gradient(700px 420px at 90% 10%, rgba(20, 90, 140, 0.35), transparent 70%),
      var(--bg);
    transition: opacity 0.35s ease;
  }

  #loader.hide {
    opacity: 0;
    pointer-events: none;
  }

  .logo {
    font-size: 13px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .title {
    font-size: clamp(26px, 6vw, 52px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 30%, #a9b8ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .bar {
    width: min(420px, 70vw);
    height: 14px;
    padding: 2px;
    border: 2px solid var(--line);
  }

  .fill {
    width: 0%;
    height: 100%;
    background: var(--accent);
    box-shadow: 0 0 16px rgba(255, 159, 28, 0.5);
    transition: width 0.2s ease;
  }

  .hint {
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--dim);
  }

  .hint.error {
    max-width: 70vw;
    color: #ff8a7a;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<div id="loader">
  <div class="logo">Hano Games</div>
  <div class="title">Pixel Rampage</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="hint" id="hint">Р—Р°РіСЂСѓР·РєР°вЂ¦</div>
</div>

<script>
  var canvas = document.querySelector("#unity-canvas");
  var loader = document.querySelector("#loader");
  var fill = document.querySelector("#fill");
  var hint = document.querySelector("#hint");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  var buildUrl = "Build2";
  var loaderUrl = buildUrl + "/WebGL.loader.js";

  var config = {
    dataUrl: buildUrl + "/WebGL.data.br",
    frameworkUrl: buildUrl + "/WebGL.framework.js.br",
    codeUrl: buildUrl + "/WebGL.wasm.br",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Hano Games",
    productName: "Pixel Rampage",
    productVersion: "0.1.0"
  };

  var script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = function () {
    createUnityInstance(canvas, config, function (progress) {
      var percent = Math.round(progress * 100);
      fill.style.width = Math.max(4, percent) + "%";
      if (percent < 100) hint.textContent = percent + "%";
    }).then(function (instance) {
      window.unityInstance = instance;
      loader.classList.add("hide");
      setTimeout(function () { loader.style.display = "none"; }, 400);
      canvas.focus();
    }).catch(function (message) {
      console.error(message);
      hint.classList.add("error");
      hint.textContent = "РќРµ СѓРґР°Р»РѕСЃСЊ Р·Р°РіСЂСѓР·РёС‚СЊ РёРіСЂСѓ: " + message;
    });
  };
  script.onerror = function () {
    hint.classList.add("error");
    hint.textContent = "РќРµ СѓРґР°Р»РѕСЃСЊ Р·Р°РіСЂСѓР·РёС‚СЊ СЃР±РѕСЂРєСѓ. РџСЂРѕРІРµСЂСЊ, С‡С‚Рѕ РїР°РїРєР° Build Р»РµР¶РёС‚ СЂСЏРґРѕРј СЃ index.html.";
  };

  document.body.appendChild(script);
</script>

</body>
</html>
